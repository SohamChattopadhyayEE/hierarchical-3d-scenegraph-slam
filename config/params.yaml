# Shared parameters for utils/ros2_streamer.py (node: dataset_streamer) and
# mapping_node.py (node: mapping_node).
#
# Run with, e.g.:
#   python3 utils/ros2_streamer.py --ros-args --params-file config/params.yaml
#   python3 mapping_node.py --ros-args --params-file config/params.yaml
#
# Any value here can still be overridden on the command line with
# -p name:=value, which takes precedence over this file.

# Topic names shared by both nodes (dataset_streamer publishes on these,
# mapping_node subscribes to them). The '/**' wildcard applies a parameter
# to any node that declares one with a matching name.
/**:
  ros__parameters:
    rgb_topic: camera/rgb/image_raw
    depth_topic: camera/depth/image_raw
    odom_topic: odom
    imu_topic: imu/data_raw

dataset_streamer:
  ros__parameters:
    # dataset_path is intentionally omitted: it defaults to the
    # rgbd_dataset_freiburg1_desk folder next to ros2_streamer.py. Set it
    # here (or via -p dataset_path:=...) to point at a different dataset.
    playback_rate: 0.4
    loop: false
    depth_scale: 5000.0
    camera_frame_id: camera_rgb_optical_frame
    odom_frame_id: odom
    base_frame_id: base_link
    imu_frame_id: imu_link
    map_frame_id: map
    publish_tf: true

mapping_node:
  ros__parameters:
    mask_topic: segmentation/mask

    # 'fastsam' or 'mobilesam'; only the selected one is instantiated.
    segmentor_type: fastsam

    # A bare ultralytics asset name (e.g. FastSAM-s.pt, FastSAM-x.pt) is
    # auto-downloaded on first use; point this at a local .pt file instead
    # to use your own weights.
    fastsam_model_path:  FastSAM-s.pt
    conf_threshold: 0.8
    iou_threshold: 0.9

    # REQUIRED for segmentor_type: mobilesam (e.g. mobile_sam.pt).
    mobilesam_checkpoint_path: "mobile_sam.pt"
    mobilesam_model_type: vit_t
    points_per_side: 16
    pred_iou_thresh: 0.88
    stability_score_thresh: 0.95

    device: cuda:0

    # <segmentor_type> is appended automatically, e.g. datasets/segmented_masks/fastsam.
    # Relative paths are resolved against the working directory the node is
    # launched from.
    output_dataset_dir: datasets/segmented_masks

    # Pinhole intrinsics for back-projecting depth into 3D (TUM freiburg1
    # defaults). Change these if you point dataset_path at a different
    # sequence/camera.
    fx: 517.3
    fy: 516.5
    cx: 318.6
    cy: 255.3

    # Per-object 3D tracking output (trajectory.txt, *_points.npy, *.png
    # crops), one folder per tracked object id under objects_output_dir.
    objects_output_dir: datasets/objects
    # Max distance (metres) between a detection and an existing track's
    # predicted position to count as the same object; beyond this, a new
    # track/id is spawned instead.
    track_gate_m: 0.1
